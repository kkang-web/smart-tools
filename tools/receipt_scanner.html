<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영수증 스캐너</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100vh; overflow: hidden; }
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Malgun Gothic', 'Segoe UI', sans-serif;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
    }

    header { text-align: center; margin-bottom: 16px; flex-shrink: 0; }
    header h1 { font-size: 28px; font-weight: 700; color: #3b82f6; letter-spacing: -.5px; }
    header p  { margin-top: 6px; font-size: 14px; color: #8b949e; }

    .container {
      max-width: 1100px; margin: 0 auto;
      flex: 1; display: flex; flex-direction: column;
      overflow: hidden; min-height: 0; width: 100%;
    }

    /* API Key bar */
    .api-bar {
      display: flex; align-items: center; gap: 8px;
      background: #161b22; border: 1px solid #21262d;
      border-radius: 8px; padding: 8px 14px;
      margin-bottom: 12px; flex-shrink: 0;
    }
    .api-bar label { font-size: 12px; color: #6e7681; white-space: nowrap; }
    .api-bar input {
      flex: 1; background: #0d1117; border: 1px solid #30363d;
      border-radius: 6px; color: #e6edf3; font-size: 13px;
      padding: 5px 10px; font-family: monospace; min-width: 0;
    }
    .api-bar input:focus { outline: none; border-color: #3b82f6; }
    .api-bar .api-status { font-size: 12px; white-space: nowrap; }
    .api-bar .api-status.ok  { color: #22c55e; }

    /* Upload zone */
    .upload-zone {
      border: 2px dashed #30363d; border-radius: 12px;
      padding: 36px 24px; text-align: center; cursor: pointer;
      background: #161b22; position: relative; flex-shrink: 0;
      transition: border-color .2s, background .2s;
    }
    .upload-zone:hover, .upload-zone.drag-over { border-color: #3b82f6; background: #0d1a2e; }
    .upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .upload-zone .icon { font-size: 40px; margin-bottom: 10px; }
    .upload-zone h2 { font-size: 17px; color: #c9d1d9; margin-bottom: 6px; }
    .upload-zone p  { font-size: 13px; color: #6e7681; }
    .upload-zone.hidden { display: none; }

    /* Error box */
    .error-box {
      background: #1c1014; border: 1px solid #ef4444;
      border-radius: 8px; padding: 12px 16px;
      color: #ef4444; font-size: 14px;
      margin-top: 10px; display: none;
    }

    /* Main grid */
    .main-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 20px; margin-top: 16px;
      flex: 1; min-height: 0; overflow: hidden;
    }
    @media (max-width: 800px) { .main-grid { grid-template-columns: 1fr; } }

    .panel {
      background: #161b22; border: 1px solid #21262d;
      border-radius: 12px; display: flex;
      flex-direction: column; overflow: hidden; min-height: 0;
    }
    .panel-header {
      padding: 12px 20px; border-bottom: 1px solid #21262d;
      font-size: 13px; font-weight: 600; color: #8b949e;
      text-transform: uppercase; letter-spacing: .5px;
      flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    }
    .panel-body {
      padding: 16px; flex: 1; overflow-y: auto; min-height: 0;
    }
    .panel-body.preview-body {
      overflow: hidden; display: flex;
      align-items: center; justify-content: center; padding: 12px;
    }
    .panel-footer {
      display: flex; gap: 10px; padding: 12px 16px;
      border-top: 1px solid #21262d; flex-shrink: 0; background: #161b22;
    }

    /* Image preview */
    #imgPreview {
      max-width: 100%; max-height: 100%;
      object-fit: contain; border-radius: 8px; display: none;
    }
    .img-placeholder { text-align: center; padding: 60px 20px; color: #6e7681; font-size: 14px; }

    /* Nav counter */
    .nav-wrap { display: flex; align-items: center; gap: 8px; }
    .nav-btn {
      background: #21262d; border: 1px solid #30363d; border-radius: 5px;
      color: #c9d1d9; font-size: 13px; padding: 3px 10px; cursor: pointer;
    }
    .nav-btn:disabled { opacity: .35; cursor: not-allowed; }
    .nav-counter { font-size: 12px; color: #6e7681; white-space: nowrap; }

    /* Loading */
    .loading { display: none; text-align: center; padding: 40px 20px; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #21262d; border-top-color: #3b82f6;
      border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p { color: #8b949e; font-size: 14px; }

    /* Summary cards */
    .summary-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; margin-bottom: 20px;
    }
    .summary-card {
      background: #0d1117; border: 1px solid #21262d;
      border-radius: 8px; padding: 14px 16px;
    }
    .summary-card.full { grid-column: 1 / -1; }
    .summary-card .label { font-size: 11px; color: #6e7681; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
    .summary-card .value { font-size: 16px; font-weight: 600; color: #e6edf3; }
    .summary-card.total .value { font-size: 22px; color: #3b82f6; }

    /* Items table */
    .items-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .items-table th {
      text-align: left; padding: 8px 12px;
      background: #0d1117; color: #6e7681;
      font-size: 12px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .4px; border-bottom: 1px solid #21262d;
    }
    .items-table td { padding: 10px 12px; border-bottom: 1px solid #161b22; color: #c9d1d9; }
    .items-table tbody tr:hover td { background: #1c2128; }
    .items-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .items-table tfoot td {
      padding: 12px 12px; font-weight: 700; color: #e6edf3;
      border-top: 1px solid #30363d;
    }
    .items-table tfoot td.num { color: #3b82f6; font-size: 16px; }

    .empty-state { text-align: center; padding: 48px 20px; color: #6e7681; font-size: 14px; }
    .empty-state .icon { font-size: 36px; margin-bottom: 10px; }

    /* Buttons */
    button {
      cursor: pointer; border: none; border-radius: 6px;
      font-family: inherit; font-size: 13px; font-weight: 600;
      padding: 8px 16px; transition: opacity .15s;
    }
    button:hover { opacity: .85; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-green   { background: #166534; color: #86efac; border: 1px solid #15803d; }
    .btn-ghost   { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>영수증 스캐너</h1>
    <p>이미지를 업로드하면 AI가 자동으로 항목을 추출합니다</p>
  </header>

  <!-- API Key -->
  <div class="api-bar">
    <label>Gemini API Key</label>
    <input type="password" id="apiKeyInput" placeholder="AIza...">
    <span class="api-status" id="apiStatus"></span>
  </div>

  <!-- Upload zone -->
  <div class="upload-zone" id="uploadZone">
    <input type="file" id="fileInput" accept="image/*" multiple>
    <div class="icon">🧾</div>
    <h2>영수증 이미지를 드래그하거나 클릭하여 업로드</h2>
    <p>여러 파일 동시 선택 가능 · JPG, PNG, WEBP, HEIC · 최대 10MB/장</p>
  </div>

  <div id="errorBox" class="error-box"></div>

  <!-- Main grid (hidden until upload) -->
  <div class="main-grid" id="mainGrid" style="display:none">

    <!-- Left: Preview -->
    <div class="panel">
      <div class="panel-header">미리보기</div>
      <div class="panel-body preview-body">
        <img id="imgPreview" alt="영수증 미리보기">
        <div class="img-placeholder" id="imgPlaceholder">이미지를 업로드하면 여기에 표시됩니다</div>
      </div>
    </div>

    <!-- Right: Results -->
    <div class="panel">
      <div class="panel-header">
        <span id="panelTitle">추출 결과</span>
        <!-- Navigation (multi-file) -->
        <div class="nav-wrap" id="navWrap" style="display:none">
          <button class="nav-btn" id="btnPrev">◀</button>
          <span class="nav-counter" id="navCounter"></span>
          <button class="nav-btn" id="btnNext">▶</button>
        </div>
      </div>
      <div class="panel-body" id="resultBody">
        <div class="loading" id="loadingState">
          <div class="spinner"></div>
          <p id="loadingMsg">Gemini AI가 영수증을 분석 중입니다…</p>
        </div>
        <div class="empty-state" id="emptyState">
          <div class="icon">🔍</div>
          <p>분석 결과가 여기에 표시됩니다</p>
        </div>
        <div id="resultContent" style="display:none">
          <div class="summary-grid">
            <div class="summary-card full">
              <div class="label">가맹점명</div>
              <div class="value" id="rMerchant">—</div>
            </div>
            <div class="summary-card">
              <div class="label">결제일시</div>
              <div class="value" id="rDatetime">—</div>
            </div>
            <div class="summary-card total">
              <div class="label">총 결제금액</div>
              <div class="value" id="rTotal">—</div>
            </div>
          </div>
          <table class="items-table">
            <thead>
              <tr>
                <th>품목명</th><th class="num">수량</th>
                <th class="num">단가</th><th class="num">금액</th>
              </tr>
            </thead>
            <tbody id="itemsBody"></tbody>
            <tfoot id="itemsFoot"></tfoot>
          </table>
        </div>
      </div>
      <div class="panel-footer" id="panelFooter" style="display:none">
        <button class="btn-primary" id="btnCopy">📋 복사</button>
        <button class="btn-green"   id="btnExcel" style="display:none">📊 엑셀 저장</button>
        <button class="btn-ghost"   id="btnNew" style="margin-left:auto">완료</button>
      </div>
    </div>

  </div>
</div>

<script>
  const GEMINI_BASE  = 'https://generativelanguage.googleapis.com/v1/models';
  const GEMINI_MODEL = 'gemini-2.5-flash-lite';

  // ── State ──
  const results  = []; // { filename, objectUrl, status, data, error }
  let   current  = 0;  // index shown
  let   processing = false;

  // ── DOM ──
  const apiKeyInput  = document.getElementById('apiKeyInput');
  const apiStatus    = document.getElementById('apiStatus');
  const uploadZone   = document.getElementById('uploadZone');
  const fileInput    = document.getElementById('fileInput');
  const mainGrid     = document.getElementById('mainGrid');
  const imgPreview   = document.getElementById('imgPreview');
  const imgPlaceholder = document.getElementById('imgPlaceholder');
  const loadingState = document.getElementById('loadingState');
  const loadingMsg   = document.getElementById('loadingMsg');
  const emptyState   = document.getElementById('emptyState');
  const resultContent= document.getElementById('resultContent');
  const errorBox     = document.getElementById('errorBox');
  const panelFooter  = document.getElementById('panelFooter');
  const navWrap      = document.getElementById('navWrap');
  const navCounter   = document.getElementById('navCounter');
  const btnPrev      = document.getElementById('btnPrev');
  const btnNext      = document.getElementById('btnNext');
  const btnExcel     = document.getElementById('btnExcel');

  // ── API key ──
  const saved = localStorage.getItem('gemini_api_key');
  if (saved) { apiKeyInput.value = saved; setApiOk(true); }
  apiKeyInput.addEventListener('input', () => {
    const v = apiKeyInput.value.trim();
    localStorage.setItem('gemini_api_key', v);
    setApiOk(v.length > 10);
  });
  function getKey() { return apiKeyInput.value.trim(); }
  function setApiOk(ok) {
    apiStatus.textContent = ok ? '✓ 저장됨' : '';
    apiStatus.className = 'api-status' + (ok ? ' ok' : '');
  }

  // ── Upload ──
  uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
  uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
  uploadZone.addEventListener('drop', e => {
    e.preventDefault(); uploadZone.classList.remove('drag-over');
    handleFiles([...e.dataTransfer.files]);
  });
  fileInput.addEventListener('change', () => { handleFiles([...fileInput.files]); fileInput.value = ''; });

  document.getElementById('btnNew').addEventListener('click', reset);
  document.getElementById('btnCopy').addEventListener('click', copyResult);
  btnPrev.addEventListener('click', () => { current--; showResult(current); });
  btnNext.addEventListener('click', () => { current++; showResult(current); });
  btnExcel.addEventListener('click', exportToExcel);

  function handleFiles(files) {
    if (!getKey()) { alert('Gemini API 키를 먼저 입력하세요.'); apiKeyInput.focus(); return; }
    const valid = files.filter(f => f.type.startsWith('image/') && f.size <= 10 * 1024 * 1024);
    if (!valid.length) return;

    errorBox.style.display = 'none';
    uploadZone.classList.add('hidden');
    mainGrid.style.display = 'grid';
    panelFooter.style.display = 'flex';

    valid.forEach(file => {
      results.push({ filename: file.name, file, objectUrl: URL.createObjectURL(file), status: 'pending', data: null, error: null });
    });

    current = results.length - valid.length; // jump to first new file
    showResult(current);
    if (!processing) processQueue();
  }

  // ── Queue ──
  async function processQueue() {
    processing = true;
    while (true) {
      const idx = results.findIndex(r => r.status === 'pending');
      if (idx === -1) break;
      results[idx].status = 'processing';
      if (idx === current) showResult(current);
      try {
        const r = results[idx];
        const b64 = await fileToBase64(r.file);
        r.data = await callGemini(b64, r.file.type || 'image/jpeg', getKey());
        r.status = 'done';
      } catch (e) {
        results[idx].error = e.message;
        results[idx].status = 'error';
      }
      if (idx === current) showResult(current);
      updateNav();
      updateExcelBtn();
    }
    processing = false;
  }

  function fileToBase64(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = e => res(e.target.result.split(',')[1]);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
  }

  async function callGemini(b64, mimeType, apiKey) {
    const url = `${GEMINI_BASE}/${GEMINI_MODEL}:generateContent?key=${apiKey}`;
    const prompt = `다음 영수증 이미지를 분석하여 아래 JSON 형식으로 정보를 추출해주세요.
반드시 JSON만 반환하고, 다른 텍스트는 포함하지 마세요.

{
  "merchant": "가맹점명 (없으면 null)",
  "datetime": "결제일시 (YYYY-MM-DD HH:mm 형식, 없으면 null)",
  "items": [
    { "name": "품목명", "qty": 수량(숫자), "unit_price": 단가(숫자), "amount": 금액(숫자) }
  ],
  "subtotal": 소계(숫자 또는 null),
  "tax": 부가세(숫자 또는 null),
  "total": 총결제금액(숫자)
}

주의사항:
- 모든 금액은 원화 기준 숫자(쉼표·원 기호 제거)로 입력
- 수량이 표시되지 않은 경우 1로 설정
- 단가가 없으면 금액÷수량으로 계산
- 한글 품목명을 그대로 사용
- 인식 불확실 항목도 최대한 추출`;

    const body = {
      contents: [{ parts: [
        { inlineData: { mimeType, data: b64 } },
        { text: prompt }
      ]}],
      generationConfig: { temperature: 0.1, maxOutputTokens: 2048 }
    };
    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e?.error?.message || `API 오류 (${res.status})`); }
    const data = await res.json();
    const cand = data?.candidates?.[0];
    if (!cand) throw new Error('응답 없음');
    if (cand.finishReason === 'SAFETY') throw new Error('안전 정책으로 차단됨');
    const text = cand?.content?.parts?.[0]?.text || '';
    if (!text) throw new Error('빈 응답');
    const fenced = text.match(/```(?:json)?\s*([\s\S]*?)```/);
    const jsonStr = fenced ? fenced[1].trim() : text.slice(text.indexOf('{'), text.lastIndexOf('}') + 1);
    try { return JSON.parse(jsonStr); }
    catch { throw new Error('JSON 파싱 실패'); }
  }

  // ── Display ──
  function showResult(idx) {
    if (idx < 0 || idx >= results.length) return;
    current = idx;
    const r = results[idx];

    // Preview
    imgPreview.src = r.objectUrl;
    imgPreview.style.display = 'block';
    imgPlaceholder.style.display = 'none';

    // Status
    if (r.status === 'pending' || r.status === 'processing') {
      loadingState.style.display = '';
      loadingMsg.textContent = r.status === 'processing' ? 'Gemini AI가 영수증을 분석 중입니다…' : '대기 중...';
      emptyState.style.display = 'none';
      resultContent.style.display = 'none';
    } else if (r.status === 'error') {
      loadingState.style.display = 'none';
      emptyState.style.display = 'none';
      resultContent.style.display = '';
      document.getElementById('rMerchant').textContent = '오류';
      document.getElementById('rDatetime').textContent = '—';
      document.getElementById('rTotal').textContent = '—';
      document.getElementById('itemsBody').innerHTML = `<tr><td colspan="4" style="color:#ef4444;padding:20px;text-align:center">⚠️ ${esc(r.error)}</td></tr>`;
      document.getElementById('itemsFoot').innerHTML = '';
    } else {
      loadingState.style.display = 'none';
      emptyState.style.display = 'none';
      resultContent.style.display = '';
      renderData(r.data);
    }

    updateNav();
  }

  function renderData(d) {
    document.getElementById('rMerchant').textContent = d.merchant || '알 수 없음';
    document.getElementById('rDatetime').textContent = d.datetime  || '알 수 없음';
    document.getElementById('rTotal').textContent    = fmt(d.total);

    const tbody = document.getElementById('itemsBody');
    tbody.innerHTML = '';
    const items = Array.isArray(d.items) ? d.items : [];
    if (!items.length) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#6e7681;padding:24px">항목 없음</td></tr>';
    } else {
      items.forEach(it => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${esc(it.name||'?')}</td>
          <td class="num">${it.qty ?? 1}</td>
          <td class="num">${it.unit_price != null ? Number(it.unit_price).toLocaleString('ko-KR') : '—'}</td>
          <td class="num">${it.amount    != null ? Number(it.amount).toLocaleString('ko-KR')    : '—'}</td>`;
        tbody.appendChild(tr);
      });
    }

    const tfoot = document.getElementById('itemsFoot');
    tfoot.innerHTML = '';
    const footRows = [];
    if (d.subtotal != null) footRows.push(['소계', fmt(d.subtotal)]);
    if (d.tax      != null) footRows.push(['부가세', fmt(d.tax)]);
    footRows.push(['합계', fmt(d.total)]);
    footRows.forEach(([label, val], i) => {
      const isLast = i === footRows.length - 1;
      const tr = document.createElement('tr');
      tr.innerHTML = `<td colspan="3" style="color:${isLast?'#e6edf3':'#8b949e'}">${label}</td>
        <td class="num" style="color:${isLast?'#3b82f6':'#8b949e'};${isLast?'font-size:16px':''}">${val}</td>`;
      tfoot.appendChild(tr);
    });
  }

  function updateNav() {
    const n = results.length;
    if (n > 1) {
      navWrap.style.display = 'flex';
      navCounter.textContent = `${current + 1} / ${n}`;
      btnPrev.disabled = current === 0;
      btnNext.disabled = current === n - 1;
    } else {
      navWrap.style.display = 'none';
    }
  }

  function updateExcelBtn() {
    const doneCount = results.filter(r => r.status === 'done').length;
    btnExcel.style.display = doneCount > 0 ? '' : 'none';
    btnExcel.textContent = `📊 엑셀 저장 (${doneCount}개)`;
  }

  // ── Reset ──
  function reset() {
    results.forEach(r => URL.revokeObjectURL(r.objectUrl));
    results.length = 0;
    current = 0;
    fileInput.value = '';
    imgPreview.style.display = 'none';
    imgPreview.src = '';
    imgPlaceholder.style.display = '';
    mainGrid.style.display = 'none';
    panelFooter.style.display = 'none';
    errorBox.style.display = 'none';
    uploadZone.classList.remove('hidden');
    navWrap.style.display = 'none';
    btnExcel.style.display = 'none';
    loadingState.style.display = 'none';
    emptyState.style.display = '';
    resultContent.style.display = 'none';
  }

  // ── Copy ──
  function copyResult() {
    if (!results[current]?.data) return;
    const d = results[current].data;
    const rows = [...document.querySelectorAll('#itemsBody tr')].map(tr =>
      [...tr.querySelectorAll('td')].map(td => td.textContent.trim()).join('\t')
    );
    const text = [
      `가맹점: ${d.merchant||''}`,
      `결제일시: ${d.datetime||''}`,
      `총금액: ${fmt(d.total)}`,
      '', '품목명\t수량\t단가\t금액', ...rows
    ].join('\n');
    navigator.clipboard.writeText(text)
      .then(() => {
        const btn = document.getElementById('btnCopy');
        btn.textContent = '✅ 복사됨';
        setTimeout(() => { btn.textContent = '📋 복사'; }, 1800);
      });
  }

  // ── Excel export ──
  function exportToExcel() {
    const done = results.filter(r => r.status === 'done');
    if (!done.length) return;
    const wb = XLSX.utils.book_new();

    // Sheet 1: Summary
    const s1 = [['파일명', '가맹점명', '결제일시', '총금액(원)', '항목수']];
    done.forEach(r => {
      const d = r.data;
      s1.push([r.filename, d.merchant||'', d.datetime||'', d.total??'', (d.items||[]).length]);
    });
    const ws1 = XLSX.utils.aoa_to_sheet(s1);
    ws1['!cols'] = [{ wch:30 },{ wch:24 },{ wch:18 },{ wch:14 },{ wch:8 }];
    XLSX.utils.book_append_sheet(wb, ws1, '영수증 요약');

    // Sheet 2: Items
    const s2 = [['파일명', '가맹점명', '결제일시', '품목명', '수량', '단가(원)', '금액(원)']];
    done.forEach(r => {
      const d = r.data;
      const items = Array.isArray(d.items) ? d.items : [];
      if (!items.length) {
        s2.push([r.filename, d.merchant||'', d.datetime||'', '', '', '', '']);
      } else {
        items.forEach(it => s2.push([r.filename, d.merchant||'', d.datetime||'', it.name||'', it.qty??1, it.unit_price??'', it.amount??'']));
      }
    });
    const ws2 = XLSX.utils.aoa_to_sheet(s2);
    ws2['!cols'] = [{ wch:28 },{ wch:22 },{ wch:17 },{ wch:28 },{ wch:6 },{ wch:12 },{ wch:12 }];
    XLSX.utils.book_append_sheet(wb, ws2, '항목 상세');

    XLSX.writeFile(wb, `영수증_${new Date().toISOString().slice(0,10)}.xlsx`);
  }

  // ── Helpers ──
  function fmt(n) {
    if (n == null || isNaN(Number(n))) return '—';
    return Number(n).toLocaleString('ko-KR') + '원';
  }
  function esc(s) {
    return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
