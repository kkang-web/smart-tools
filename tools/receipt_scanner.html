<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영수증 스캐너</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100vh;
      overflow: hidden;
    }
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Malgun Gothic', 'Segoe UI', sans-serif;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
      flex-shrink: 0;
    }
    header h1 {
      font-size: 28px;
      font-weight: 700;
      color: #3b82f6;
      letter-spacing: -0.5px;
    }
    header p {
      margin-top: 6px;
      font-size: 14px;
      color: #8b949e;
    }

    /* API Key bar */
    .api-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 8px;
      padding: 8px 14px;
      margin-bottom: 12px;
      flex-shrink: 0;
    }
    .api-bar label {
      font-size: 12px;
      color: #6e7681;
      white-space: nowrap;
    }
    .api-bar input {
      flex: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      font-size: 13px;
      padding: 5px 10px;
      font-family: monospace;
      min-width: 0;
    }
    .api-bar input:focus { outline: none; border-color: #3b82f6; }
    .api-bar .api-status {
      font-size: 12px;
      white-space: nowrap;
    }
    .api-bar .api-status.ok  { color: #22c55e; }
    .api-bar .api-status.err { color: #ef4444; }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
      width: 100%;
    }

    /* Upload zone */
    .upload-zone {
      border: 2px dashed #30363d;
      border-radius: 12px;
      padding: 36px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      background: #161b22;
      position: relative;
      flex-shrink: 0;
    }
    .upload-zone.hidden { display: none; }
    .upload-zone:hover,
    .upload-zone.drag-over {
      border-color: #3b82f6;
      background: #0d1a2e;
    }
    .upload-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }
    .upload-icon {
      font-size: 48px;
      margin-bottom: 12px;
      line-height: 1;
    }
    .upload-zone h2 {
      font-size: 18px;
      color: #c9d1d9;
      margin-bottom: 8px;
    }
    .upload-zone p {
      font-size: 13px;
      color: #6e7681;
    }

    /* Main layout */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 16px;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    @media (max-width: 800px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    .panel {
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }
    .panel-header {
      padding: 12px 20px;
      border-bottom: 1px solid #21262d;
      font-size: 13px;
      font-weight: 600;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }
    .panel-body {
      padding: 16px;
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    /* Image preview */
    #imgPreview {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 8px;
      display: none;
    }
    .panel-body.preview-body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow: hidden;
    }
    .img-placeholder {
      text-align: center;
      padding: 60px 20px;
      color: #6e7681;
      font-size: 14px;
    }

    /* Loading */
    .loading {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #21262d;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p { color: #8b949e; font-size: 14px; }

    /* Summary cards */
    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .summary-card {
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 8px;
      padding: 14px 16px;
    }
    .summary-card.full { grid-column: 1 / -1; }
    .summary-card .label {
      font-size: 11px;
      color: #6e7681;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .summary-card .value {
      font-size: 16px;
      font-weight: 600;
      color: #e6edf3;
    }
    .summary-card.total .value {
      font-size: 22px;
      color: #3b82f6;
    }

    /* Items table */
    .items-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    .items-table th {
      text-align: left;
      padding: 8px 12px;
      background: #0d1117;
      color: #6e7681;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      border-bottom: 1px solid #21262d;
    }
    .items-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #161b22;
      color: #c9d1d9;
    }
    .items-table tbody tr:hover td { background: #1c2128; }
    .items-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .items-table tfoot td {
      padding: 12px 12px;
      font-weight: 700;
      color: #e6edf3;
      border-top: 1px solid #30363d;
    }
    .items-table tfoot td.num { color: #3b82f6; font-size: 16px; }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: #6e7681;
      font-size: 14px;
    }
    .empty-state .icon { font-size: 36px; margin-bottom: 10px; }

    /* Error */
    .error-box {
      background: #1c1014;
      border: 1px solid #ef4444;
      border-radius: 8px;
      padding: 14px 16px;
      color: #ef4444;
      font-size: 14px;
      margin-top: 12px;
      display: none;
    }

    /* Panel footer (always visible) */
    .panel-footer {
      display: flex;
      gap: 10px;
      padding: 12px 16px;
      border-top: 1px solid #21262d;
      flex-shrink: 0;
      background: #161b22;
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 16px;
      transition: opacity .15s;
    }
    button:hover { opacity: .85; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-ghost {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
    }
    .btn-danger { background: #ef4444; color: #fff; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>영수증 스캐너</h1>
      <p>이미지를 업로드하면 AI가 자동으로 항목을 추출합니다</p>
    </header>

    <!-- API Key bar -->
    <div class="api-bar">
      <label>Gemini API Key</label>
      <input type="password" id="apiKeyInput" placeholder="AIza...">
      <span class="api-status" id="apiStatus"></span>
    </div>

    <!-- Upload Zone -->
    <div class="upload-zone" id="uploadZone">
      <input type="file" id="fileInput" accept="image/*">
      <div class="upload-icon">🧾</div>
      <h2>영수증 이미지를 드래그하거나 클릭하여 업로드</h2>
      <p>JPG, PNG, WEBP, HEIC 지원 · 최대 10MB</p>
    </div>

    <div id="errorBox" class="error-box"></div>

    <!-- Main Grid -->
    <div class="main-grid" id="mainGrid" style="display:none">
      <!-- Left: Image Preview -->
      <div class="panel">
        <div class="panel-header">미리보기</div>
        <div class="panel-body preview-body">
          <img id="imgPreview" alt="영수증 미리보기">
          <div class="img-placeholder" id="imgPlaceholder">
            이미지를 업로드하면 여기에 표시됩니다
          </div>
        </div>
      </div>

      <!-- Right: Results -->
      <div class="panel">
        <div class="panel-header">추출 결과</div>
        <div class="panel-body">

          <!-- Loading -->
          <div class="loading" id="loadingState">
            <div class="spinner"></div>
            <p id="loadingMsg">Gemini AI가 영수증을 분석 중입니다…</p>
          </div>

          <!-- Empty state -->
          <div class="empty-state" id="emptyState">
            <div class="icon">🔍</div>
            <p>분석 결과가 여기에 표시됩니다</p>
          </div>

          <!-- Result content -->
          <div id="resultContent" style="display:none">
            <!-- Summary -->
            <div class="summary-grid">
              <div class="summary-card full">
                <div class="label">가맹점명</div>
                <div class="value" id="rMerchant">—</div>
              </div>
              <div class="summary-card">
                <div class="label">결제일시</div>
                <div class="value" id="rDatetime">—</div>
              </div>
              <div class="summary-card total">
                <div class="label">총 결제금액</div>
                <div class="value" id="rTotal">—</div>
              </div>
            </div>

            <!-- Items table -->
            <table class="items-table">
              <thead>
                <tr>
                  <th>품목명</th>
                  <th class="num">수량</th>
                  <th class="num">단가</th>
                  <th class="num">금액</th>
                </tr>
              </thead>
              <tbody id="itemsBody"></tbody>
              <tfoot id="itemsFoot"></tfoot>
            </table>
          </div>

        </div>

        <!-- 항상 보이는 하단 버튼 -->
        <div class="panel-footer" id="panelFooter" style="display:none">
          <button class="btn-primary" id="btnCopy">📋 복사</button>
          <button class="btn-ghost" id="btnNew">완료</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const GEMINI_MODEL = 'gemini-2.5-flash-lite';
    const GEMINI_BASE  = 'https://generativelanguage.googleapis.com/v1/models';

    const uploadZone = document.getElementById('uploadZone');
    const fileInput  = document.getElementById('fileInput');
    const mainGrid   = document.getElementById('mainGrid');
    const imgPreview = document.getElementById('imgPreview');
    const imgPlaceholder = document.getElementById('imgPlaceholder');
    const loadingState  = document.getElementById('loadingState');
    const loadingMsg    = document.getElementById('loadingMsg');
    const emptyState    = document.getElementById('emptyState');
    const resultContent = document.getElementById('resultContent');
    const errorBox      = document.getElementById('errorBox');
    const apiKeyInput   = document.getElementById('apiKeyInput');
    const apiStatus     = document.getElementById('apiStatus');

    // API 키 localStorage 불러오기
    const savedKey = localStorage.getItem('gemini_api_key');
    if (savedKey) { apiKeyInput.value = savedKey; setApiStatus(true); }

    apiKeyInput.addEventListener('input', () => {
      const v = apiKeyInput.value.trim();
      localStorage.setItem('gemini_api_key', v);
      setApiStatus(v.length > 10);
    });

    function getApiKey() { return apiKeyInput.value.trim(); }
    function setApiStatus(ok) {
      apiStatus.textContent = ok ? '✓ 저장됨' : '';
      apiStatus.className = 'api-status ' + (ok ? 'ok' : '');
    }

    // Drag & drop
    uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
    uploadZone.addEventListener('drop', e => {
      e.preventDefault();
      uploadZone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file) handleFile(file);
    });
    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) handleFile(fileInput.files[0]);
    });

    document.getElementById('btnNew').addEventListener('click', reset);
    document.getElementById('btnCopy').addEventListener('click', copyResult);

    function reset() {
      fileInput.value = '';
      imgPreview.style.display = 'none';
      imgPreview.src = '';
      imgPlaceholder.style.display = '';
      mainGrid.style.display = 'none';
      errorBox.style.display = 'none';
      uploadZone.classList.remove('hidden');
      document.getElementById('panelFooter').style.display = 'none';
      showEmpty();
    }

    function showEmpty() {
      loadingState.style.display = 'none';
      emptyState.style.display = '';
      resultContent.style.display = 'none';
    }
    function showLoading(msg) {
      loadingMsg.textContent = msg || 'Gemini AI가 영수증을 분석 중입니다…';
      loadingState.style.display = '';
      emptyState.style.display = 'none';
      resultContent.style.display = 'none';
    }
    function showResult() {
      loadingState.style.display = 'none';
      emptyState.style.display = 'none';
      resultContent.style.display = '';
      document.getElementById('panelFooter').style.display = 'flex';
    }
    function showError(msg) {
      errorBox.textContent = '오류: ' + msg;
      errorBox.style.display = '';
      // 결과 패널 안에도 오류 표시
      loadingState.style.display = 'none';
      emptyState.style.display = 'none';
      resultContent.style.display = '';
      document.getElementById('rMerchant').textContent = '오류';
      document.getElementById('rDatetime').textContent = '—';
      document.getElementById('rTotal').textContent = '—';
      document.getElementById('itemsBody').innerHTML =
        `<tr><td colspan="4" style="color:#ef4444;padding:20px;text-align:center">⚠️ ${escHtml(msg)}</td></tr>`;
      document.getElementById('itemsFoot').innerHTML = '';
      document.getElementById('panelFooter').style.display = 'flex';
    }

    async function handleFile(file) {
      if (!file.type.startsWith('image/')) { showError('이미지 파일만 업로드할 수 있습니다.'); return; }
      if (file.size > 10 * 1024 * 1024) { showError('파일 크기가 10MB를 초과합니다.'); return; }
      const apiKey = getApiKey();
      if (!apiKey) { alert('Gemini API 키를 먼저 입력하세요.'); apiKeyInput.focus(); return; }

      errorBox.style.display = 'none';
      uploadZone.classList.add('hidden');
      mainGrid.style.display = 'grid';
      showLoading();

      // Preview
      const reader = new FileReader();
      reader.onload = e => {
        imgPreview.src = e.target.result;
        imgPreview.style.display = 'block';
        imgPlaceholder.style.display = 'none';
      };
      reader.readAsDataURL(file);

      // Base64 for API
      const b64 = await fileToBase64(file);
      const mimeType = file.type || 'image/jpeg';

      try {
        showLoading('Gemini AI가 영수증을 분석 중입니다…');
        const result = await callGemini(b64, mimeType, apiKey);
        renderResult(result);
        showResult();
      } catch (err) {
        showError(err.message);
      }
    }

    function fileToBase64(file) {
      return new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = e => res(e.target.result.split(',')[1]);
        r.onerror = rej;
        r.readAsDataURL(file);
      });
    }

    async function callGemini(base64Data, mimeType, apiKey) {
      const GEMINI_URL = `${GEMINI_BASE}/${GEMINI_MODEL}:generateContent?key=${apiKey}`;
      const prompt = `다음 영수증 이미지를 분석하여 아래 JSON 형식으로 정보를 추출해주세요.
반드시 JSON만 반환하고, 다른 텍스트는 포함하지 마세요.

{
  "merchant": "가맹점명 (없으면 null)",
  "datetime": "결제일시 (YYYY-MM-DD HH:mm 형식, 없으면 null)",
  "items": [
    { "name": "품목명", "qty": 수량(숫자), "unit_price": 단가(숫자), "amount": 금액(숫자) }
  ],
  "subtotal": 소계(숫자 또는 null),
  "tax": 부가세(숫자 또는 null),
  "total": 총결제금액(숫자)
}

주의사항:
- 모든 금액은 원화 기준 숫자(쉼표·원 기호 제거)로 입력
- 수량이 표시되지 않은 경우 1로 설정
- 단가가 없으면 금액을 수량으로 나누어 계산
- 한글 품목명을 그대로 사용
- 인식이 불확실한 항목도 최대한 추출`;

      const body = {
        contents: [{
          parts: [
            { inlineData: { mimeType, data: base64Data } },
            { text: prompt }
          ]
        }],
        generationConfig: { temperature: 0.1, maxOutputTokens: 2048 }
      };

      const res = await fetch(GEMINI_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData?.error?.message || `API 오류 (${res.status})`);
      }

      const data = await res.json();

      // 안전 차단 여부 확인
      const candidate = data?.candidates?.[0];
      if (!candidate) throw new Error('API 응답에 candidates가 없습니다. ' + JSON.stringify(data).substring(0, 200));

      const finishReason = candidate.finishReason;
      if (finishReason === 'SAFETY') throw new Error('안전 정책으로 처리가 차단됐습니다.');

      const text = candidate?.content?.parts?.[0]?.text || '';
      if (!text) throw new Error('API가 빈 텍스트를 반환했습니다. finishReason=' + finishReason);

      // JSON 추출 — 마크다운 코드블록 우선, 없으면 중괄호 범위 추출
      let jsonStr = '';
      const fenced = text.match(/```(?:json)?\s*([\s\S]*?)```/);
      if (fenced) {
        jsonStr = fenced[1].trim();
      } else {
        const start = text.indexOf('{');
        const end   = text.lastIndexOf('}');
        if (start === -1 || end === -1) throw new Error('응답에서 JSON을 찾을 수 없습니다: ' + text.substring(0, 120));
        jsonStr = text.slice(start, end + 1);
      }

      try {
        return JSON.parse(jsonStr);
      } catch (e) {
        throw new Error('JSON 파싱 실패 (' + e.message + '): ' + jsonStr.substring(0, 120));
      }
    }

    function fmt(n) {
      if (n == null || n === '' || isNaN(Number(n))) return '—';
      return Number(n).toLocaleString('ko-KR') + '원';
    }

    function renderResult(d) {
      document.getElementById('rMerchant').textContent = d.merchant || '알 수 없음';
      document.getElementById('rDatetime').textContent  = d.datetime  || '알 수 없음';
      document.getElementById('rTotal').textContent     = fmt(d.total);

      const tbody = document.getElementById('itemsBody');
      tbody.innerHTML = '';

      const items = Array.isArray(d.items) ? d.items : [];
      if (items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#6e7681;padding:24px">항목을 인식하지 못했습니다</td></tr>';
      } else {
        items.forEach(item => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${escHtml(item.name || '?')}</td>
            <td class="num">${item.qty != null ? item.qty : 1}</td>
            <td class="num">${item.unit_price != null ? Number(item.unit_price).toLocaleString('ko-KR') : '—'}</td>
            <td class="num">${item.amount != null ? Number(item.amount).toLocaleString('ko-KR') : '—'}</td>
          `;
          tbody.appendChild(tr);
        });
      }

      const tfoot = document.getElementById('itemsFoot');
      tfoot.innerHTML = '';
      const footRows = [];
      if (d.subtotal != null) footRows.push(['소계', fmt(d.subtotal)]);
      if (d.tax      != null) footRows.push(['부가세', fmt(d.tax)]);
      footRows.push(['합계', fmt(d.total)]);

      footRows.forEach(([label, val], i) => {
        const tr = document.createElement('tr');
        const isLast = i === footRows.length - 1;
        tr.innerHTML = `
          <td colspan="3" style="color:${isLast ? '#e6edf3' : '#8b949e'}">${label}</td>
          <td class="num" style="${isLast ? 'color:#3b82f6;font-size:16px' : 'color:#8b949e'}">${val}</td>
        `;
        tfoot.appendChild(tr);
      });
    }

    function copyResult() {
      const merchant = document.getElementById('rMerchant').textContent;
      const datetime = document.getElementById('rDatetime').textContent;
      const total    = document.getElementById('rTotal').textContent;

      const rows = [...document.querySelectorAll('#itemsBody tr')].map(tr => {
        const cells = [...tr.querySelectorAll('td')].map(td => td.textContent.trim());
        return cells.join('\t');
      });

      const text = [
        `가맹점: ${merchant}`,
        `결제일시: ${datetime}`,
        `총금액: ${total}`,
        '',
        '품목명\t수량\t단가\t금액',
        ...rows
      ].join('\n');

      navigator.clipboard.writeText(text)
        .then(() => {
          const btn = document.getElementById('btnCopy');
          btn.textContent = '✅ 복사됨';
          setTimeout(() => { btn.textContent = '📋 복사'; }, 1800);
        })
        .catch(() => alert('클립보드 복사에 실패했습니다.'));
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>
</body>
</html>
