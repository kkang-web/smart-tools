<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영수증 스캐너</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100vh;
      overflow: hidden;
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Malgun Gothic', 'Segoe UI', sans-serif;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px 20px 0;
    }

    /* ── Header ── */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      margin-bottom: 10px;
    }
    .app-header h1 { font-size: 22px; font-weight: 700; color: #3b82f6; }
    .app-header p  { font-size: 13px; color: #6e7681; margin-top: 2px; }

    /* ── API Key bar ── */
    .api-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 8px;
      padding: 7px 14px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }
    .api-bar label { font-size: 12px; color: #6e7681; white-space: nowrap; }
    .api-bar input {
      flex: 1; background: #0d1117; border: 1px solid #30363d;
      border-radius: 6px; color: #e6edf3; font-size: 13px;
      padding: 4px 10px; font-family: monospace; min-width: 0;
    }
    .api-bar input:focus { outline: none; border-color: #3b82f6; }
    .api-ok  { font-size: 12px; color: #22c55e; white-space: nowrap; }
    .api-err { font-size: 12px; color: #ef4444; white-space: nowrap; }

    /* ── Upload zone ── */
    .drop-zone {
      border: 2px dashed #30363d;
      border-radius: 10px;
      padding: 28px 20px;
      text-align: center;
      cursor: pointer;
      background: #161b22;
      transition: border-color .2s, background .2s;
      position: relative;
      flex-shrink: 0;
      margin-bottom: 10px;
    }
    .drop-zone input {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%;
    }
    .drop-zone:hover, .drop-zone.over { border-color: #3b82f6; background: #0d1a2e; }
    .drop-zone .dz-icon { font-size: 32px; margin-bottom: 6px; }
    .drop-zone h2 { font-size: 15px; color: #c9d1d9; margin-bottom: 4px; }
    .drop-zone p  { font-size: 12px; color: #6e7681; }

    /* Compact add-more bar (shown after first upload) */
    .add-bar {
      display: none;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }
    .add-bar.visible { display: flex; }
    .btn-add {
      display: inline-flex; align-items: center; gap: 6px;
      background: #161b22; border: 1px dashed #30363d; border-radius: 8px;
      color: #8b949e; font-size: 13px; font-weight: 600;
      padding: 7px 16px; cursor: pointer; position: relative;
      transition: border-color .2s, color .2s;
    }
    .btn-add input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
    .btn-add:hover { border-color: #3b82f6; color: #3b82f6; }
    .add-bar .stats { font-size: 13px; color: #6e7681; margin-left: auto; }

    /* ── Receipt list (scrollable) ── */
    .receipt-list {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-bottom: 8px;
    }
    .receipt-list::-webkit-scrollbar { width: 6px; }
    .receipt-list::-webkit-scrollbar-track { background: transparent; }
    .receipt-list::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #6e7681;
      gap: 8px;
    }
    .empty-state .icon { font-size: 40px; }
    .empty-state p { font-size: 14px; }

    /* ── Receipt Card ── */
    .receipt-card {
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 10px;
      overflow: hidden;
      transition: border-color .15s;
    }
    .receipt-card:hover { border-color: #30363d; }

    .card-head {
      display: grid;
      grid-template-columns: 56px 1fr auto auto;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      cursor: pointer;
    }
    .card-thumb {
      width: 56px; height: 56px;
      object-fit: cover; border-radius: 6px;
      background: #0d1117; flex-shrink: 0;
    }
    .card-thumb.placeholder {
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; color: #30363d;
    }
    .card-info { min-width: 0; }
    .card-filename {
      font-size: 11px; color: #6e7681;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 3px;
    }
    .card-merchant {
      font-size: 15px; font-weight: 600; color: #e6edf3;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card-datetime { font-size: 12px; color: #8b949e; margin-top: 2px; }
    .card-total {
      text-align: right; flex-shrink: 0;
    }
    .card-total .amount {
      font-size: 16px; font-weight: 700; color: #3b82f6;
      white-space: nowrap;
    }
    .card-total .item-count { font-size: 11px; color: #6e7681; margin-top: 2px; }

    .card-toggle {
      font-size: 11px; color: #6e7681; flex-shrink: 0; user-select: none;
      transition: transform .2s;
    }
    .receipt-card.expanded .card-toggle { transform: rotate(180deg); }

    /* Status badges */
    .badge {
      display: inline-block; font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 20px; white-space: nowrap;
    }
    .badge-pending    { background: #21262d; color: #6e7681; }
    .badge-processing { background: #1a2a4a; color: #3b82f6; }
    .badge-done       { background: #0e2a1a; color: #22c55e; }
    .badge-error      { background: #2a0e0e; color: #ef4444; }

    .spin-inline {
      display: inline-block;
      width: 10px; height: 10px;
      border: 2px solid #21262d; border-top-color: #3b82f6;
      border-radius: 50%; animation: spin .6s linear infinite;
      vertical-align: middle; margin-right: 4px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Card detail (items table) */
    .card-detail {
      display: none;
      border-top: 1px solid #21262d;
      overflow: hidden;
    }
    .receipt-card.expanded .card-detail { display: block; }

    .items-table {
      width: 100%; border-collapse: collapse; font-size: 13px;
    }
    .items-table th {
      text-align: left; padding: 7px 14px;
      background: #0d1117; color: #6e7681;
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .4px; border-bottom: 1px solid #21262d;
    }
    .items-table td { padding: 8px 14px; border-bottom: 1px solid #161b22; color: #c9d1d9; }
    .items-table tbody tr:last-child td { border-bottom: none; }
    .items-table tbody tr:hover td { background: #1c2128; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .items-table tfoot td {
      padding: 9px 14px; border-top: 1px solid #30363d;
      font-weight: 700; color: #e6edf3;
    }
    .items-table tfoot .num { color: #3b82f6; font-size: 15px; }

    .error-detail {
      padding: 14px 16px;
      color: #ef4444; font-size: 13px;
    }

    /* ── Export bar (fixed bottom) ── */
    .export-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #161b22;
      border-top: 1px solid #21262d;
      padding: 10px 20px;
      flex-shrink: 0;
    }
    .export-bar.visible { display: flex; }
    .export-info { font-size: 13px; color: #8b949e; }
    .export-info strong { color: #e6edf3; }

    .btn-excel {
      display: flex; align-items: center; gap: 7px;
      background: #166534; color: #86efac;
      border: 1px solid #15803d; border-radius: 7px;
      font-family: inherit; font-size: 13px; font-weight: 600;
      padding: 8px 18px; cursor: pointer; transition: background .15s;
    }
    .btn-excel:hover { background: #15803d; }
    .btn-excel:disabled { opacity: .4; cursor: not-allowed; }

    .btn-clear {
      background: #21262d; color: #8b949e;
      border: 1px solid #30363d; border-radius: 7px;
      font-family: inherit; font-size: 13px; font-weight: 600;
      padding: 8px 14px; cursor: pointer; transition: background .15s;
    }
    .btn-clear:hover { background: #30363d; color: #c9d1d9; }
  </style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div class="app-header">
    <div>
      <h1>영수증 스캐너</h1>
      <p>여러 영수증을 한 번에 업로드하고 엑셀로 추출</p>
    </div>
  </div>

  <!-- API Key -->
  <div class="api-bar">
    <label>Gemini API Key</label>
    <input type="password" id="apiKeyInput" placeholder="AIza...">
    <span id="apiStatus"></span>
  </div>

  <!-- Drop zone (initial) -->
  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" multiple accept="image/*">
    <div class="dz-icon">🧾</div>
    <h2>영수증 이미지를 드래그하거나 클릭하여 업로드</h2>
    <p>여러 파일 동시 선택 가능 · JPG, PNG, WEBP, HEIC · 최대 10MB/장</p>
  </div>

  <!-- Add more bar (shows after first upload) -->
  <div class="add-bar" id="addBar">
    <label class="btn-add">
      <input type="file" id="fileInputMore" multiple accept="image/*">
      + 영수증 추가
    </label>
    <span class="stats" id="statsText"></span>
  </div>

  <!-- Empty state -->
  <div class="empty-state" id="emptyState">
    <div class="icon">🔍</div>
    <p>파일을 업로드하면 결과가 여기에 표시됩니다</p>
  </div>

  <!-- Receipt cards list -->
  <div class="receipt-list" id="receiptList" style="display:none"></div>

</div>

<!-- Export bar (fixed bottom) -->
<div class="export-bar" id="exportBar">
  <span class="export-info" id="exportInfo"></span>
  <div style="display:flex;gap:8px">
    <button class="btn-clear" id="btnClear">초기화</button>
    <button class="btn-excel" id="btnExcel">📊 엑셀 내보내기</button>
  </div>
</div>

<script>
  const GEMINI_BASE = 'https://generativelanguage.googleapis.com/v1/models';
  const GEMINI_MODEL = 'gemini-2.5-flash-lite';

  // ── State ──
  const receipts = []; // { id, file, objectUrl, status, data, error }
  let processing = false;

  // ── DOM ──
  const apiKeyInput  = document.getElementById('apiKeyInput');
  const apiStatus    = document.getElementById('apiStatus');
  const dropZone     = document.getElementById('dropZone');
  const fileInput    = document.getElementById('fileInput');
  const fileInputMore= document.getElementById('fileInputMore');
  const addBar       = document.getElementById('addBar');
  const statsText    = document.getElementById('statsText');
  const emptyState   = document.getElementById('emptyState');
  const receiptList  = document.getElementById('receiptList');
  const exportBar    = document.getElementById('exportBar');
  const exportInfo   = document.getElementById('exportInfo');
  const btnExcel     = document.getElementById('btnExcel');
  const btnClear     = document.getElementById('btnClear');

  // ── API Key ──
  const savedKey = localStorage.getItem('gemini_api_key');
  if (savedKey) { apiKeyInput.value = savedKey; updateApiStatus(true); }
  apiKeyInput.addEventListener('input', () => {
    const v = apiKeyInput.value.trim();
    localStorage.setItem('gemini_api_key', v);
    updateApiStatus(v.length > 10);
  });
  function getApiKey() { return apiKeyInput.value.trim(); }
  function updateApiStatus(ok) {
    apiStatus.textContent = ok ? '✓ 저장됨' : '';
    apiStatus.className = ok ? 'api-ok' : '';
  }

  // ── Drag & drop on drop zone ──
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('over');
    addFiles([...e.dataTransfer.files]);
  });
  fileInput.addEventListener('change', () => { addFiles([...fileInput.files]); fileInput.value = ''; });
  fileInputMore.addEventListener('change', () => { addFiles([...fileInputMore.files]); fileInputMore.value = ''; });

  // Drag & drop anywhere on page (after first upload)
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => {
    e.preventDefault();
    if (receipts.length > 0) addFiles([...e.dataTransfer.files]);
  });

  btnExcel.addEventListener('click', exportToExcel);
  btnClear.addEventListener('click', clearAll);

  // ── Add files ──
  function addFiles(files) {
    if (!getApiKey()) { alert('Gemini API 키를 먼저 입력하세요.'); apiKeyInput.focus(); return; }
    const valid = files.filter(f => f.type.startsWith('image/') && f.size <= 10 * 1024 * 1024);
    if (valid.length < files.length) alert(`${files.length - valid.length}개 파일이 제외됐습니다 (이미지 아님 또는 10MB 초과).`);
    if (!valid.length) return;

    valid.forEach(file => {
      const id = Date.now() + Math.random();
      receipts.push({ id, file, objectUrl: URL.createObjectURL(file), status: 'pending', data: null, error: null });
      renderCard(receipts[receipts.length - 1]);
    });

    updateUI();
    if (!processing) processQueue();
  }

  // ── Processing queue ──
  async function processQueue() {
    processing = true;
    while (true) {
      const receipt = receipts.find(r => r.status === 'pending');
      if (!receipt) break;
      receipt.status = 'processing';
      updateCard(receipt);
      updateFooter();
      try {
        const b64 = await fileToBase64(receipt.file);
        const mimeType = receipt.file.type || 'image/jpeg';
        receipt.data = await callGemini(b64, mimeType, getApiKey());
        receipt.status = 'done';
      } catch (e) {
        receipt.error = e.message;
        receipt.status = 'error';
      }
      updateCard(receipt);
      updateFooter();
    }
    processing = false;
  }

  function fileToBase64(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = e => res(e.target.result.split(',')[1]);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
  }

  async function callGemini(base64Data, mimeType, apiKey) {
    const url = `${GEMINI_BASE}/${GEMINI_MODEL}:generateContent?key=${apiKey}`;
    const prompt = `다음 영수증 이미지를 분석하여 아래 JSON 형식으로 정보를 추출해주세요.
반드시 JSON만 반환하고, 다른 텍스트는 포함하지 마세요.

{
  "merchant": "가맹점명 (없으면 null)",
  "datetime": "결제일시 (YYYY-MM-DD HH:mm 형식, 없으면 null)",
  "items": [
    { "name": "품목명", "qty": 수량(숫자), "unit_price": 단가(숫자), "amount": 금액(숫자) }
  ],
  "subtotal": 소계(숫자 또는 null),
  "tax": 부가세(숫자 또는 null),
  "total": 총결제금액(숫자)
}

주의사항:
- 모든 금액은 원화 기준 숫자(쉼표·원 기호 제거)로 입력
- 수량이 표시되지 않은 경우 1로 설정
- 단가가 없으면 금액÷수량으로 계산
- 한글 품목명을 그대로 사용
- 인식 불확실 항목도 최대한 추출`;

    const body = {
      contents: [{ parts: [
        { inlineData: { mimeType, data: base64Data } },
        { text: prompt }
      ]}],
      generationConfig: { temperature: 0.1, maxOutputTokens: 2048 }
    };

    const res = await fetch(url, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err?.error?.message || `API 오류 (${res.status})`);
    }
    const data = await res.json();
    const candidate = data?.candidates?.[0];
    if (!candidate) throw new Error('응답 없음');
    if (candidate.finishReason === 'SAFETY') throw new Error('안전 정책으로 차단됨');
    const text = candidate?.content?.parts?.[0]?.text || '';
    if (!text) throw new Error('빈 응답');

    const fenced = text.match(/```(?:json)?\s*([\s\S]*?)```/);
    let jsonStr = fenced ? fenced[1].trim() : text.slice(text.indexOf('{'), text.lastIndexOf('}') + 1);
    try { return JSON.parse(jsonStr); }
    catch (e) { throw new Error('JSON 파싱 실패: ' + text.substring(0, 80)); }
  }

  // ── Render ──
  function renderCard(receipt) {
    const el = document.createElement('div');
    el.className = 'receipt-card';
    el.dataset.id = receipt.id;
    el.innerHTML = cardHTML(receipt);
    el.querySelector('.card-head').addEventListener('click', () => toggleCard(el));
    receiptList.appendChild(el);
  }

  function updateCard(receipt) {
    const el = receiptList.querySelector(`[data-id="${receipt.id}"]`);
    if (!el) return;
    const wasExpanded = el.classList.contains('expanded');
    el.innerHTML = cardHTML(receipt);
    el.querySelector('.card-head').addEventListener('click', () => toggleCard(el));
    if (wasExpanded) el.classList.add('expanded');
  }

  function cardHTML(r) {
    const d = r.data;
    const merchant = d?.merchant || (r.status === 'error' ? '오류' : r.status === 'pending' ? '대기 중' : '분석 중...');
    const datetime = d?.datetime || '';
    const total    = d?.total != null ? numFmt(d.total) + '원' : '';
    const items    = Array.isArray(d?.items) ? d.items : [];
    const badge    = badgeHTML(r);

    const thumb = `<img class="card-thumb" src="${r.objectUrl}" onerror="this.style.display='none'" alt="">`;

    let detail = '';
    if (r.status === 'done') {
      let rows = items.map(it => `
        <tr>
          <td>${esc(it.name||'?')}</td>
          <td class="num">${it.qty ?? 1}</td>
          <td class="num">${it.unit_price != null ? numFmt(it.unit_price) : '—'}</td>
          <td class="num">${it.amount != null ? numFmt(it.amount) : '—'}</td>
        </tr>`).join('');
      if (!rows) rows = `<tr><td colspan="4" style="color:#6e7681;text-align:center;padding:16px">항목 없음</td></tr>`;

      let foot = '';
      if (d.subtotal != null) foot += `<tr><td colspan="3" style="color:#8b949e">소계</td><td class="num" style="color:#8b949e">${numFmt(d.subtotal)}원</td></tr>`;
      if (d.tax != null)      foot += `<tr><td colspan="3" style="color:#8b949e">부가세</td><td class="num" style="color:#8b949e">${numFmt(d.tax)}원</td></tr>`;
      if (d.total != null)    foot += `<tr><td colspan="3">합계</td><td class="num">${numFmt(d.total)}원</td></tr>`;

      detail = `
        <div class="card-detail">
          <table class="items-table">
            <thead><tr><th>품목명</th><th class="num">수량</th><th class="num">단가</th><th class="num">금액</th></tr></thead>
            <tbody>${rows}</tbody>
            ${foot ? `<tfoot>${foot}</tfoot>` : ''}
          </table>
        </div>`;
    } else if (r.status === 'error') {
      detail = `<div class="card-detail"><div class="error-detail">⚠️ ${esc(r.error)}</div></div>`;
    }

    return `
      <div class="card-head">
        ${thumb}
        <div class="card-info">
          <div class="card-filename">${esc(r.file.name)}</div>
          <div class="card-merchant">${esc(merchant)}</div>
          ${datetime ? `<div class="card-datetime">${esc(datetime)}</div>` : ''}
          <div style="margin-top:4px">${badge}</div>
        </div>
        <div class="card-total">
          ${total ? `<div class="amount">${total}</div>` : ''}
          ${items.length ? `<div class="item-count">${items.length}개 항목</div>` : ''}
        </div>
        <div class="card-toggle">▼</div>
      </div>
      ${detail}`;
  }

  function badgeHTML(r) {
    if (r.status === 'pending')    return `<span class="badge badge-pending">대기</span>`;
    if (r.status === 'processing') return `<span class="badge badge-processing"><span class="spin-inline"></span>분석 중</span>`;
    if (r.status === 'done')       return `<span class="badge badge-done">✓ 완료</span>`;
    if (r.status === 'error')      return `<span class="badge badge-error">오류</span>`;
    return '';
  }

  function toggleCard(el) {
    el.classList.toggle('expanded');
  }

  // ── UI State ──
  function updateUI() {
    const hasAny = receipts.length > 0;
    dropZone.style.display    = hasAny ? 'none' : '';
    emptyState.style.display  = hasAny ? 'none' : '';
    receiptList.style.display = hasAny ? 'flex'  : 'none';
    if (hasAny) addBar.classList.add('visible');
    else        addBar.classList.remove('visible');
    updateFooter();
  }

  function updateFooter() {
    const done  = receipts.filter(r => r.status === 'done').length;
    const total = receipts.length;
    const pending = receipts.filter(r => r.status === 'pending' || r.status === 'processing').length;

    statsText.textContent = `총 ${total}개 · 완료 ${done}개${pending ? ` · 처리 중 ${pending}개` : ''}`;

    if (done > 0) {
      exportBar.classList.add('visible');
      exportInfo.innerHTML = `<strong>${done}개</strong> 영수증 추출 완료`;
      btnExcel.disabled = false;
    } else {
      exportBar.classList.remove('visible');
    }
  }

  function clearAll() {
    receipts.forEach(r => URL.revokeObjectURL(r.objectUrl));
    receipts.length = 0;
    receiptList.innerHTML = '';
    exportBar.classList.remove('visible');
    addBar.classList.remove('visible');
    dropZone.style.display = '';
    emptyState.style.display = '';
    receiptList.style.display = 'none';
    statsText.textContent = '';
  }

  // ── Excel Export ──
  function exportToExcel() {
    const done = receipts.filter(r => r.status === 'done');
    if (!done.length) return;

    const wb = XLSX.utils.book_new();

    // Sheet 1: Summary
    const summaryRows = [['파일명', '가맹점명', '결제일시', '총금액(원)', '항목수']];
    done.forEach(r => {
      const d = r.data;
      summaryRows.push([
        r.file.name,
        d.merchant || '',
        d.datetime || '',
        d.total ?? '',
        Array.isArray(d.items) ? d.items.length : 0
      ]);
    });
    const ws1 = XLSX.utils.aoa_to_sheet(summaryRows);
    ws1['!cols'] = [{ wch: 30 }, { wch: 24 }, { wch: 18 }, { wch: 14 }, { wch: 8 }];
    styleHeader(ws1, summaryRows[0].length);
    XLSX.utils.book_append_sheet(wb, ws1, '영수증 요약');

    // Sheet 2: All items
    const itemRows = [['파일명', '가맹점명', '결제일시', '품목명', '수량', '단가(원)', '금액(원)']];
    done.forEach(r => {
      const d = r.data;
      const items = Array.isArray(d.items) ? d.items : [];
      if (!items.length) {
        itemRows.push([r.file.name, d.merchant || '', d.datetime || '', '', '', '', '']);
      } else {
        items.forEach(it => {
          itemRows.push([
            r.file.name, d.merchant || '', d.datetime || '',
            it.name || '', it.qty ?? 1, it.unit_price ?? '', it.amount ?? ''
          ]);
        });
      }
    });
    const ws2 = XLSX.utils.aoa_to_sheet(itemRows);
    ws2['!cols'] = [{ wch: 28 }, { wch: 22 }, { wch: 17 }, { wch: 28 }, { wch: 6 }, { wch: 12 }, { wch: 12 }];
    styleHeader(ws2, itemRows[0].length);
    XLSX.utils.book_append_sheet(wb, ws2, '항목 상세');

    const date = new Date().toISOString().slice(0, 10);
    XLSX.writeFile(wb, `영수증_추출결과_${date}.xlsx`);
  }

  function styleHeader(ws, colCount) {
    for (let c = 0; c < colCount; c++) {
      const cell = ws[XLSX.utils.encode_cell({ r: 0, c })];
      if (cell) {
        cell.s = { font: { bold: true }, fill: { fgColor: { rgb: '1F3864' } } };
      }
    }
  }

  // ── Helpers ──
  function numFmt(n) {
    if (n == null || isNaN(Number(n))) return '';
    return Number(n).toLocaleString('ko-KR');
  }
  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</body>
